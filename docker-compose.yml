version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: finadvisor_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: finadvisor
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: always

  backend:
    build:
      context: ./backend
    container_name: finadvisor_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=finadvisor
      - JWT_SECRET=development_secret_only
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - BINANCE_API_URL=https://api.binance.com/api/v3
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: finadvisor_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: always

volumes:
  db_data:
